version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vxn-opt-mongodb
    ports:
      - '27018:27017' # Truy cập từ ngoài qua port 27018
    volumes:
      - mongodb_opt_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: vexenhanh
    networks:
      - vxn-opt-network

  redis:
    image: redis:7-alpine
    container_name: vxn-opt-redis
    ports:
      - '6380:6379'
    volumes:
      - redis_opt_data:/data
    command: redis-server --appendonly yes
    networks:
      - vxn-opt-network

  mongo-express:
    image: mongo-express
    container_name: vxn-opt-mongo-express
    ports:
      - '8082:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - vxn-opt-network

  osrm:
    image: osrm/osrm-backend:latest
    container_name: vxn-osrm-optimized
    ports:
      - '5001:5000'
    volumes:
      - ./osrm/data:/data
    command: osrm-routed --algorithm mld /data/vietnam-latest.osrm
    restart: unless-stopped
    networks:
      - vxn-opt-network

volumes:
  mongodb_opt_data:
  redis_opt_data:

networks:
  vxn-opt-network:
    driver: bridge
