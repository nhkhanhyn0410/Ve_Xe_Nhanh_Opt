services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: vxn-opt-backend:latest
    container_name: vxn-opt-backend
    ports:
      - '5501:5501'
    environment:
      NODE_ENV: production
      PORT: 5501
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/vexenhanh?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      JWT_SECRET: dev-only-jwt-secret-change-me-32-chars
      JWT_ACCESS_EXPIRES: 1800
      JWT_REFRESH_EXPIRES: 604800
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
      OSRM_URL: http://osrm:5000
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5501/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - vxn-opt-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:5501/api/v1
    image: vxn-opt-frontend:latest
    container_name: vxn-opt-frontend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - vxn-opt-network

  mongodb:
    image: mongo:7.0
    container_name: vxn-opt-mongodb
    ports:
      - '27018:27017' # Truy cập từ ngoài qua port 27018
    volumes:
      - mongodb_opt_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: vexenhanh
    networks:
      - vxn-opt-network

  redis:
    image: redis:7-alpine
    container_name: vxn-opt-redis
    ports:
      - '6380:6379'
    volumes:
      - redis_opt_data:/data
    command: redis-server --appendonly yes
    networks:
      - vxn-opt-network

  mongo-express:
    image: mongo-express
    container_name: vxn-opt-mongo-express
    ports:
      - '8082:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - vxn-opt-network

  osrm:
    image: osrm/osrm-backend:latest
    container_name: vxn-osrm-optimized
    ports:
      - '5001:5000'
    volumes:
      - ./osrm/data:/data
    command: osrm-routed --algorithm mld /data/vietnam-latest.osrm
    restart: unless-stopped
    networks:
      - vxn-opt-network

volumes:
  mongodb_opt_data:
  redis_opt_data:

networks:
  vxn-opt-network:
    driver: bridge
